<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>房间配对测试</title>
</head>
<body>
  <h1>房间配对测试</h1>

  <p id="connection-status">正在连接服务器……</p>
  <p>当前房间：<strong id="current-room">未加入</strong></p>
  <p id="peer-status">尚未配对</p>

  <div>
    <button id="create-room" disabled>创建房间</button>
    <button id="leave-room" disabled>离开房间</button>
  </div>

  <hr>

  <form id="join-form">
    <input
      id="room-code"
      placeholder="请输入六位房间码"
      inputmode="numeric"
      maxlength="6"
      pattern="[0-9]{6}"
      autocomplete="off"
      required
      disabled
    >
    <button id="join-room" type="submit" disabled>
      加入房间
    </button>
  </form>

  <hr>

  <form id="message-form">
    <input
      id="message"
      placeholder="请输入消息"
      maxlength="1000"
      autocomplete="off"
      required
      disabled
    >
    <button id="send-message" type="submit" disabled>
      发送
    </button>
  </form>

  <pre id="log"></pre>

  <script>
    const connectionStatus =
      document.getElementById("connection-status");
    const currentRoom = document.getElementById("current-room");
    const peerStatus = document.getElementById("peer-status");

    const createButton = document.getElementById("create-room");
    const leaveButton = document.getElementById("leave-room");

    const joinForm = document.getElementById("join-form");
    const roomInput = document.getElementById("room-code");
    const joinButton = document.getElementById("join-room");

    const messageForm = document.getElementById("message-form");
    const messageInput = document.getElementById("message");
    const sendButton = document.getElementById("send-message");

    const log = document.getElementById("log");

    let connected = false;
    let roomId = null;
    let peerConnected = false;

    const wsProtocol =
      location.protocol === "https:" ? "wss:" : "ws:";

    const socket = new WebSocket(
      `${wsProtocol}//${location.host}/ws`
    );

    function addLog(text) {
      // 使用 textContent，消息会作为文字显示。
      log.textContent += text + "\n";
    }

    function updateUI() {
      currentRoom.textContent = roomId || "未加入";

      if (!connected) {
        peerStatus.textContent = "服务器未连接";
      } else if (!roomId) {
        peerStatus.textContent = "尚未配对";
      } else if (peerConnected) {
        peerStatus.textContent = "对方已加入，可以发送消息";
      } else {
        peerStatus.textContent = "等待另一台设备加入";
      }

      createButton.disabled = !connected || Boolean(roomId);
      roomInput.disabled = !connected || Boolean(roomId);
      joinButton.disabled = !connected || Boolean(roomId);

      leaveButton.disabled = !connected || !roomId;

      const canSend = connected && Boolean(roomId) && peerConnected;

      messageInput.disabled = !canSend;
      sendButton.disabled = !canSend;
    }

    function send(message) {
      if (socket.readyState !== WebSocket.OPEN) {
        addLog("错误：服务器连接不可用。");
        return false;
      }

      socket.send(JSON.stringify(message));
      return true;
    }

    socket.addEventListener("open", () => {
      connected = true;
      connectionStatus.textContent = "服务器已连接";
      addLog("已连接服务器。");
      updateUI();
    });

    socket.addEventListener("message", (event) => {
      let message;

      try {
        message = JSON.parse(event.data);
      } catch {
        addLog("错误：服务器返回了无法解析的消息。");
        return;
      }

      if (!message || typeof message.type !== "string") {
        addLog("错误：服务器消息缺少类型。");
        return;
      }

      switch (message.type) {
        case "room-created":
          roomId = message.roomId;
          peerConnected = false;
          addLog(`房间已创建：${roomId}，请将房间码告知另一台设备。`);
          break;

        case "room-joined":
          roomId = message.roomId;
          peerConnected = true;
          addLog(`已加入房间：${roomId}`);
          break;

        case "peer-joined":
          peerConnected = true;
          addLog("另一台设备已加入。");
          break;

        case "peer-left":
          peerConnected = false;
          addLog("对方已离开，房间保留，可以等待新设备加入。");
          break;

        case "room-left":
          roomId = null;
          peerConnected = false;
          addLog("你已离开房间。");
          break;

        case "relay":
          addLog("对方：" + message.text);
          break;

        case "error":
          addLog("错误：" + message.message);
          break;

        default:
          addLog("收到未知消息类型：" + message.type);
      }

      updateUI();
    });

    socket.addEventListener("close", () => {
      connected = false;
      roomId = null;
      peerConnected = false;

      connectionStatus.textContent = "服务器已断开，请刷新页面重连";
      addLog("服务器连接已断开。");

      updateUI();
    });

    socket.addEventListener("error", () => {
      addLog("连接发生错误，请检查服务器和网络。");
    });

    createButton.addEventListener("click", () => {
      send({
        type: "create-room",
      });
    });

    joinForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const code = roomInput.value.trim();

      if (!/^\d{6}$/.test(code)) {
        addLog("请输入六位数字房间码。");
        return;
      }

      send({
        type: "join-room",
        roomId: code,
      });
    });

    leaveButton.addEventListener("click", () => {
      send({
        type: "leave-room",
      });
    });

    messageForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const text = messageInput.value.trim();

      if (!text || !roomId || !peerConnected) {
        return;
      }

      if (send({
        type: "relay",
        text,
      })) {
        // 这里只确认交给 WebSocket 发送，不代表对方已收到。
        addLog("我（已提交发送）：" + text);
        messageInput.value = "";
      }
    });

    updateUI();
  </script>
</body>
</html>
